<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="20" fill="#0d0d0f"/>
  <!-- Card background -->
  <rect x="12" y="12" width="76" height="76" rx="12" fill="#1c1c20" stroke="#2a2a30" stroke-width="2"/>
  <!-- Split line / groove -->
  <line x1="12" y1="50" x2="88" y2="50" stroke="#0d0d0f" stroke-width="3"/>
  <line x1="12" y1="51.5" x2="88" y2="51.5" stroke="#2e2e34" stroke-width="0.75"/>
  <!-- Digits "25" stylized -->
  <text x="50" y="65" font-family="'Oswald', 'Bebas Neue', sans-serif" font-size="44" font-weight="bold" fill="#e4e4e7" text-anchor="middle" letter-spacing="1">25</text>
  <!-- Hinge pin indicators -->
  <rect x="10" y="47" width="4" height="6" rx="1" fill="#3a3a42"/>
  <rect x="86" y="47" width="4" height="6" rx="1" fill="#3a3a42"/>
</svg>