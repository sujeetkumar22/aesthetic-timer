<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#18181d"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  
  <!-- Left Card "25" -->
  <g transform="translate(250, 140)">
    <rect width="320" height="340" rx="36" fill="#18181b" stroke="#27272a" stroke-width="2"/>
    <line x1="0" y1="170" x2="320" y2="170" stroke="#0a0a0c" stroke-width="6"/>
    <line x1="0" y1="173" x2="320" y2="173" stroke="#2e2e34" stroke-width="1.5"/>
    <text x="160" y="240" font-family="'Oswald', sans-serif" font-size="210" font-weight="700" fill="#e4e4e7" text-anchor="middle">25</text>
  </g>

  <!-- Colon separator -->
  <circle cx="600" cy="270" r="14" fill="#52525b"/>
  <circle cx="600" cy="350" r="14" fill="#52525b"/>

  <!-- Right Card "00" -->
  <g transform="translate(630, 140)">
    <rect width="320" height="340" rx="36" fill="#18181b" stroke="#27272a" stroke-width="2"/>
    <line x1="0" y1="170" x2="320" y2="170" stroke="#0a0a0c" stroke-width="6"/>
    <line x1="0" y1="173" x2="320" y2="173" stroke="#2e2e34" stroke-width="1.5"/>
    <text x="160" y="240" font-family="'Oswald', sans-serif" font-size="210" font-weight="700" fill="#e4e4e7" text-anchor="middle">00</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="600" y="90" font-family="'Inter', sans-serif" font-size="32" font-weight="700" fill="#a1a1aa" text-anchor="middle" letter-spacing="8">BIGTIMER</text>
  <text x="600" y="550" font-family="'Inter', sans-serif" font-size="28" font-weight="400" fill="#71717a" text-anchor="middle">Time, beautifully. Minimalist Fullscreen Timer</text>
</svg>
